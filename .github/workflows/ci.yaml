name: CI Pipeline - Dev

on:
  push:
    branches: [dev]

jobs:
  build:
    name: Job1 - Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t aidara05/intranet-newdeal:latest .

  security-scan:
    name: Job2 - Scan securite Trivy
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build image pour scan
        run: docker build -t intranet-newdeal:scan .

      - name: Scan vulnerabilites
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: intranet-newdeal:scan
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL

      - name: Scan secrets
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret

  push:
    name: Job3 - Push Docker Hub
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3 
        with: 
          username: ${{ secrets.DOCKERHUB_USERNAME }} 
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build et Push
        run: |
          docker build -t aidara05/intranet-newdeal:latest .
          docker push aidara05/intranet-newdeal:latest